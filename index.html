
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151622">
<title>ULTRA GPT</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:white;
 font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
 background:radial-gradient(ellipse at 20% 0%,#29345b,transparent 55%),
 radial-gradient(ellipse at 90% 90%,#482052,transparent 55%),#10111a;
 display:flex;justify-content:center;align-items:center;padding:16px
}
.app{
 width:100%;max-width:760px;height:90vh;min-height:500px;
 display:flex;flex-direction:column;overflow:hidden;
 background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.18);
 border-radius:28px;backdrop-filter:blur(20px);
 box-shadow:0 20px 70px #0006
}
header{padding:22px;border-bottom:1px solid #ffffff22;display:flex;gap:14px;align-items:center}
.logo{background:linear-gradient(135deg,#8065ff,#b14ee9);padding:15px;border-radius:17px;font-size:25px}
h2{margin:0;font-size:23px}
.sub{color:#aeb1c5;margin-top:5px}
#messages{padding:22px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.msg{padding:16px 18px;border-radius:20px;max-width:88%;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#ffffff19;border:1px solid #ffffff20;align-self:flex-start}
.user{background:linear-gradient(135deg,#6857ee,#a34be0);align-self:flex-end}
form{display:flex;gap:10px;padding:16px;border-top:1px solid #ffffff22}
input{min-width:0;flex:1;background:#ffffff12;color:white;border:1px solid #ffffff30;border-radius:18px;padding:16px;font-size:16px;outline:none}
input::placeholder{color:#aeb1c5}
button{border:0;border-radius:18px;padding:0 22px;background:linear-gradient(135deg,#6857ee,#a34be0);color:white;font-size:23px}
footer{text-align:center;color:#999db5;padding:0 10px 15px;font-size:13px}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">✦</div>
 <div><h2>ULTRA GPT</h2><div class="sub">Твой умный ИИ-помощник · DEMO</div></div>
</header>
<div id="messages">
 <div class="msg bot">Привет! Я ULTRA GPT. Чем могу помочь?</div>
</div>
<form id="form">
 <input id="message" placeholder="Напиши сообщение..." autocomplete="off">
 <button type="submit">➤</button>
</form>
<footer>ULTRA GPT · DEMO Assistant</footer>
</div>
<script>
const form=document.getElementById("form");
const input=document.getElementById("message");
const messages=document.getElementById("messages");

function addMessage(text,who){
 const el=document.createElement("div");
 el.className="msg "+who;
 el.textContent=text;
 messages.appendChild(el);
 messages.scrollTop=messages.scrollHeight;
}

function reply(text){
 const t=text.toLowerCase();
 if(t.includes("привет")||t.includes("здравств"))
  return "Привет! Рад помочь. Что хочешь узнать?";
 if(t.includes("как дела"))
  return "Всё отлично! Готов помочь тебе с вопросами и идеями.";
 if(t.includes("кто ты"))
  return "Я ULTRA GPT — демонстрационный помощник.";
 if(t.includes("время"))
  return "Текущее время на устройстве: "+new Date().toLocaleTimeString("ru-RU");
 if(t.includes("дата"))
  return "Сегодня: "+new Date().toLocaleDateString("ru-RU");
 if(t.includes("помощ"))
  return "Я могу поддержать простой диалог, ответить на приветствие и показать дату или время. Это демо, а не полноценная нейросеть.";
 return "Я пока работаю в демо-режиме и не подключён к настоящей нейросети. Могу отвечать на простые команды. Попробуй написать «Привет», «Кто ты?» или «Какая дата?»";
}

form.addEventListener("submit",function(e){
 e.preventDefault();
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 setTimeout(()=>addMessage(reply(text),"bot"),350);
});
</script>
</body>
</html>
