
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <title>ULTRA GPT</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, #26345b 0, transparent 40%),
        radial-gradient(circle at 90% 90%, #40234f 0, transparent 40%),
        #090b14;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 650px;
      min-height: 90vh;
      display: flex;
      flex-direction: column;
      border: 1px solid #ffffff25;
      background: #ffffff0d;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border-radius: 25px;
      overflow: hidden;
      box-shadow: 0 20px 70px #0008;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #ffffff20;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #7775ff, #c05cff);
      font-size: 23px;
    }

    h1 { font-size: 20px; margin: 0; }
    .subtitle { color: #a9adc5; font-size: 12px; margin-top: 4px; }

    #chat {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 300px;
    }

    .message {
      padding: 13px 16px;
      border-radius: 17px;
      max-width: 88%;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot {
      align-self: flex-start;
      background: #ffffff17;
      border: 1px solid #ffffff20;
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #625cf5, #984de0);
    }

    .composer {
      display: flex;
      gap: 9px;
      padding: 15px;
      border-top: 1px solid #ffffff20;
      background: #00000020;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      border: 1px solid #ffffff25;
      border-radius: 15px;
      padding: 14px;
      color: white;
      background: #ffffff10;
      font: inherit;
      outline: none;
    }

    textarea::placeholder { color: #a4a7ba; }

    button {
      border: 0;
      border-radius: 15px;
      padding: 0 18px;
      color: white;
      font-size: 18px;
      background: linear-gradient(135deg, #625cf5, #a34fe3);
      cursor: pointer;
    }

    button:disabled { opacity: .5; }

    .note {
      color: #9296ad;
      text-align: center;
      font-size: 11px;
      padding: 0 12px 12px;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">✦</div>
      <div>
        <h1>ULTRA GPT</h1>
        <div class="subtitle">Твой умный ИИ-помощник</div>
      </div>
    </header>

    <section id="chat">
      <div class="message bot">
        Привет! Я ULTRA GPT. Чем могу помочь?
      </div>
    </section>

    <form class="composer" id="form">
      <textarea id="message" rows="1"
        placeholder="Напиши сообщение..." required></textarea>
      <button id="send" type="submit">➤</button>
    </form>

    <div class="note">ULTRA GPT · AI Assistant</div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const send = document.getElementById("send");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "message " + type;
      div.textContent = text;
      chat.appendChild(div);
      div.scrollIntoView({ behavior: "smooth", block: "end" });
      return div;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      send.disabled = true;

      const loading = addMessage("Думаю...", "bot");

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Ошибка сервера");
        }

        loading.textContent = data.answer || "Пустой ответ";
      } catch (error) {
        loading.textContent = "Ошибка: " + error.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
